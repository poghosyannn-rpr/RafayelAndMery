<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ռաֆայել & Մերի — 26.11.26</title>
  <meta name="description" content="Wedding invitation — Rafayel & Mery, 26.11.2026" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Noto+Serif+Armenian:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="sealed">

  <!-- ===== Language switcher ===== -->
  <nav class="lang" aria-label="Language">
    <button data-lang="am" class="active" title="Հայերեն">🇦🇲</button>
    <button data-lang="en" title="English">🇬🇧</button>
    <button data-lang="ru" title="Русский">🇷🇺</button>
  </nav>

  <!-- ===== Music toggle ===== -->
  <button class="music" id="music-btn" aria-label="Music">
    <svg class="ico-play"  viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    <svg class="ico-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>
  <audio id="bg-audio" loop preload="none" src="assets/audio/music.mp3"></audio>

  <!-- ===== Envelope intro ===== -->
  <div class="envelope-screen" id="envelope-screen">
    <p class="env-invite" data-i18n="invite_line"></p>

    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open invitation">
      <span class="open-hint" data-i18n="open_hint"></span>
      <div class="env-body"></div>
      <div class="env-letter"><img src="assets/img/IMG_2633.jpg" alt="Rafayel & Mery" /></div>
      <div class="env-flap"></div>
      <div class="seal">R&amp;M</div>
    </div>

    <p class="env-note" data-i18n="envelope_note"></p>
  </div>

  <!-- ===== Main content ===== -->
  <main id="main">

    <!-- HERO -->
    <section class="section hero" id="hero">
      <div class="slides">
        <div class="slide active" style="background-image:url('assets/img/IMG_2633.jpg')"></div>
        <div class="slide" style="background-image:url('assets/img/we.jpg')"></div>
        <div class="slide" style="background-image:url('assets/img/IMG_2604.jpg')"></div>
        <div class="slide" style="background-image:url('assets/img/IMG_2603.jpg')"></div>
      </div>
      <div class="inner">
        <h1 class="hero-names">
          <span data-i18n="name_1"></span><span class="amp" data-i18n="amp"></span><span data-i18n="name_2"></span>
        </h1>
        <div class="hero-date" data-i18n="date"></div>
      </div>
      <a href="#invitation" class="chev" aria-label="Scroll down">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 9l6 6 6-6"/></svg>
      </a>
    </section>

    <!-- INVITATION MESSAGE -->
    <section class="section" id="invitation">
      <div class="bg" style="background-image:url('assets/img/IMG_2648.jpg')"></div>
      <div class="inner">
        <h2 class="heading on-photo reveal" data-i18n="inv_title"></h2>
        <div class="divider reveal d1" aria-hidden="true">
          <svg viewBox="0 0 120 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 10h40M78 10h40"/><path d="M60 3c-6 4-6 10 0 14 6-4 6-10 0-14z" fill="currentColor" stroke="none"/></svg>
        </div>
        <p class="lede on-photo reveal d2" data-i18n="inv_text"></p>
      </div>
    </section>

    <!-- CALENDAR -->
    <section class="section" id="calendar">
      <div class="bg" style="background-image:url('assets/img/IMG_2512.jpg')"></div>
      <div class="inner">
        <div class="calendar reveal">
          <div class="cal-month" data-i18n="cal_month"></div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
      </div>
    </section>

    <!-- PROGRAMME -->
    <section class="section" id="programme">
      <div class="bg" style="background-image:url('assets/img/we.jpg')"></div>
      <div class="inner">
        <h2 class="heading on-photo reveal" data-i18n="prog_title"></h2>
        <div class="prog-grid">
          <div class="prog-card reveal d1">
            <div class="prog-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="15" r="5"/><path d="M9 7l3-4 3 4"/></svg></div>
            <h3 data-i18n="ceremony_title"></h3>
            <div class="prog-time" data-i18n="ceremony_time"></div>
            <p class="prog-place" data-i18n="ceremony_place"></p>
            <a class="btn-map" id="map-ceremony" href="https://maps.google.com" target="_blank" rel="noopener" data-i18n="how_to_get"></a>
          </div>
          <div class="prog-card reveal d2">
            <div class="prog-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M7 3h10l-1 7a4 4 0 01-8 0zM12 14v5M8 21h8"/></svg></div>
            <h3 data-i18n="reception_title"></h3>
            <div class="prog-time" data-i18n="reception_time"></div>
            <p class="prog-place" data-i18n="reception_place"></p>
            <a class="btn-map" id="map-reception" href="https://maps.google.com" target="_blank" rel="noopener" data-i18n="how_to_get"></a>
          </div>
        </div>
      </div>
    </section>

    <!-- COUNTDOWN -->
    <section class="section" id="countdown">
      <div class="bg" style="background-image:url('assets/img/IMG_2604.jpg')"></div>
      <div class="inner">
        <h2 class="heading on-photo reveal" data-i18n="countdown_title"></h2>
        <div class="cd-grid reveal d1">
          <div class="cd-cell"><div class="cd-num" id="cd-days">0</div><div class="cd-lbl" data-i18n="cd_days"></div></div>
          <div class="cd-cell"><div class="cd-num" id="cd-hours">0</div><div class="cd-lbl" data-i18n="cd_hours"></div></div>
          <div class="cd-cell"><div class="cd-num" id="cd-mins">0</div><div class="cd-lbl" data-i18n="cd_mins"></div></div>
          <div class="cd-cell"><div class="cd-num" id="cd-secs">0</div><div class="cd-lbl" data-i18n="cd_secs"></div></div>
        </div>
      </div>
    </section>

    <!-- IMPORTANT INFO -->
    <section class="section" id="info">
      <div class="bg" style="background-image:url('assets/img/IMG_2603.jpg')"></div>
      <div class="inner">
        <h2 class="heading on-photo reveal" data-i18n="info_title"></h2>
        <div class="divider reveal d1" aria-hidden="true">
          <svg viewBox="0 0 120 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 10h40M78 10h40"/><path d="M60 3c-6 4-6 10 0 14 6-4 6-10 0-14z" fill="currentColor" stroke="none"/></svg>
        </div>
        <p class="lede on-photo reveal d2" data-i18n="info_text1" style="margin-bottom:20px"></p>
        <p class="lede on-photo reveal d3" data-i18n="info_text2"></p>
      </div>
    </section>

    <!-- RSVP -->
    <section class="section rsvp" id="rsvp">
      <div class="bg" style="background-image:url('assets/img/IMG_2467.jpg')"></div>
      <div class="inner">
        <h2 class="heading on-photo reveal" data-i18n="rsvp_title"></h2>
        <p class="lede on-photo reveal d1" data-i18n="rsvp_deadline"></p>

        <form class="rsvp-form reveal d2" id="rsvp-form" novalidate>
          <div class="field">
            <div class="q" data-i18n="q_attend"></div>
            <label class="opt"><input type="radio" name="attendance" value="yes"><span data-i18n="opt_yes"></span></label>
            <label class="opt"><input type="radio" name="attendance" value="no"><span data-i18n="opt_no"></span></label>
          </div>

          <div class="field">
            <div class="q" data-i18n="q_side"></div>
            <label class="opt"><input type="checkbox" name="side" value="groom"><span data-i18n="side_groom"></span></label>
            <label class="opt"><input type="checkbox" name="side" value="bride"><span data-i18n="side_bride"></span></label>
          </div>

          <div class="field">
            <div class="q" data-i18n="q_name"></div>
            <input type="text" id="guest-name" name="guest_name" autocomplete="name" />
          </div>

          <button type="submit" class="btn-send" id="send-btn" data-i18n="submit"></button>
          <div class="form-msg" id="form-msg" role="status" aria-live="polite"></div>
        </form>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="section footer" id="footer">
      <div class="bg" style="background-image:url('assets/img/IMG_2603.jpg')"></div>
      <div class="inner">
        <h2 class="heading reveal" data-i18n="footer_text"></h2>
        <div class="divider reveal d1" aria-hidden="true">
          <svg viewBox="0 0 120 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 10h40M78 10h40"/><path d="M60 3c-6 4-6 10 0 14 6-4 6-10 0-14z" fill="currentColor" stroke="none"/></svg>
        </div>
        <div class="hero-names" style="font-size:clamp(34px,8vw,72px)">
          <span data-i18n="name_1"></span><span class="amp" data-i18n="amp"></span><span data-i18n="name_2"></span>
        </div>
      </div>
    </footer>
  </main>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
