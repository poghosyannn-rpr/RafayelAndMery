# Fly.io config. Change `app` to a globally-unique name before deploying.
# Deploy:  fly launch --no-deploy   (then)  fly deploy
app = "rafayel-mery-wedding"
primary_region = "cdg"          # Paris — closest common region to Armenia

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/data/rsvp.db"     # lives on the persistent volume below

# Persistent storage for the SQLite database.
# Create it once with:  fly volumes create rsvp_data --size 1 --region cdg
[mounts]
  source = "rsvp_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false    # keep it running so RSVPs are always accepted
  auto_start_machines = true
  min_machines_running = 1
